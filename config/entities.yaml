# Canonical entities a mention can resolve to. `aliases` are exact, case-insensitive matches (resolver step 2);
# `name` + `description` are what the extraction service embeds and shows its judge for the residual (steps 3-4).
# ZIPs, bill numbers, fires and moratoria are keyed by rule and never listed here. Grows by review.
entities:
  - id: insurer:naic:25143
    type: Insurer
    name: State Farm General Insurance Company
    description: State Farm's California property-casualty subsidiary; the state's largest home insurer (NAIC 25143)
    aliases: [State Farm General, State Farm, SFG]
  - id: insurer:naic:27553
